name: Lucia Linux and Windows ARM64 release retry
on:
  push:
    branches: [release-build/0ed69a0b-linux-arm64-retry]
permissions:
  contents: read
env:
  SOURCE_COMMIT: 0ed69a0bf69eaa2ac785891476e2ef905ae6bc3b
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 330
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config python3 nasm autoconf autoconf-archive automake libtool git curl zip unzip tar libxinerama-dev libxcursor-dev libxrandr-dev xorg-dev libglu1-mesa-dev libwayland-dev
      - uses: actions/checkout@v4
        with:
          ref: 0ed69a0bf69eaa2ac785891476e2ef905ae6bc3b
          persist-credentials: false
      - name: Configure and build Release
        shell: bash
        env:
          VCPKG_MAX_CONCURRENCY: '4'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          cmake --preset linux-x64-local -B "$RUNNER_TEMP/lucia-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_EDITOR=ON -DBUILD_PLAYER=ON -DBUILD_TOOLS=OFF
          cmake --build "$RUNNER_TEMP/lucia-build" --target Editor Player --parallel 4
      - name: Package and inspect both applications
        shell: bash
        run: |
          name=LuciaEngine-1.0.0-main-0ed69a0b-Linux-x86_64
          stage="$RUNNER_TEMP/$name"
          bin="$RUNNER_TEMP/lucia-build/bin/Release"
          mkdir -p "$stage/Apps" "$RUNNER_TEMP/lucia-artifacts"
          cp -a "$bin/Apps/Editor" "$bin/Apps/Player" "$stage/Apps/"
          if [ -d "$bin/Tools" ]; then cp -a "$bin/Tools" "$stage/"; fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          printf 'Source commit: %s\nLinux x86-64 Release. Extract the archive and run Apps/Editor/Editor. Requires Vulkan and X11 or XWayland.\n' "$SOURCE_COMMIT" > "$stage/README.txt"
          for app in Editor Player; do
            readelf -h "$stage/Apps/$app/$app" | grep 'Advanced Micro Devices X86-64'
            test -d "$stage/Apps/$app/Assets/Shaders"
          done
          tar -czf "$RUNNER_TEMP/lucia-artifacts/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          tar -tzf "$RUNNER_TEMP/lucia-artifacts/$name.tar.gz" > "$RUNNER_TEMP/linux-members.txt"
          grep -Fx "$name/Apps/Editor/Editor" "$RUNNER_TEMP/linux-members.txt"
          grep -Fx "$name/Apps/Player/Player" "$RUNNER_TEMP/linux-members.txt"
          sha256sum "$RUNNER_TEMP/lucia-artifacts/$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lucia-linux-x86_64-0ed69a0b
          path: ${{ runner.temp }}/lucia-artifacts/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  windows-arm64:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ed69a0bf69eaa2ac785891476e2ef905ae6bc3b
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/lucia-vcpkg-binaries
          key: windows-vs2026-arm64-vcpkg-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/**') }}
      - name: Configure Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_MAX_CONCURRENCY: '4'
          VCPKG_BINARY_SOURCES: 'files,C:/lucia-vcpkg-binaries,readwrite'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne '0ed69a0bf69eaa2ac785891476e2ef905ae6bc3b') { throw 'Unexpected checkout' }
          if ((Get-Content VERSION -Raw).Trim() -ne '1.0.0') { throw 'Unexpected engine version' }
          New-Item -ItemType Directory -Force C:/lucia-vcpkg-binaries | Out-Null
          cmake --preset vs2026-arm64-local -B C:/lucia-release -DBUILD_TESTING=OFF -DBUILD_EDITOR=ON -DBUILD_TOOLS=OFF
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:/lucia-vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build C:/lucia-release --config Release --target Editor Player --parallel 4
      - name: Package staged Editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = 'C:/lucia-release/bin/Release'
          $name = 'LuciaEngine-1.0.0-main-0ed69a0b-Windows-arm64'
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory $stage | Out-Null
          New-Item -ItemType Directory "$stage/Apps" | Out-Null
          Copy-Item "$bin/Apps/Editor", "$bin/Apps/Player" "$stage/Apps" -Recurse
          if (Test-Path "$bin/Tools") { Copy-Item "$bin/Tools" "$stage/Tools" -Recurse }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md "$stage/"
          @'
          Lucia Engine 1.0.0
          Source commit: 0ed69a0bf69eaa2ac785891476e2ef905ae6bc3b
          Platform: Windows arm64

          Extract the entire archive. Open Apps/Editor/Editor.exe to create
          or open a project.
          A Vulkan-capable GPU driver is required to render.
          '@ | Set-Content "$stage/README.txt"
          foreach ($app in @('Editor', 'Player')) {
            $exe = "$stage/Apps/$app/$app.exe"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $header = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $header) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes, $header + 4) -ne 0xaa64) { throw "Invalid Windows executable: $exe" }
            if (-not (Test-Path "$stage/Apps/$app/Assets/Shaders")) { throw "Shaders missing for $app" }
            Get-FileHash $exe
          }
          New-Item -ItemType Directory C:/lucia-artifacts | Out-Null
          tar.exe -a -cf "C:/lucia-artifacts/$name.zip" -C $env:RUNNER_TEMP $name
          $members = @(tar.exe -tf "C:/lucia-artifacts/$name.zip")
          foreach ($app in @('Editor', 'Player')) {
            if ($members -notcontains "$name/Apps/$app/$app.exe") { throw "Archive missing $app" }
          }
          Get-FileHash "C:/lucia-artifacts/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lucia-windows-arm64-0ed69a0b
          path: C:/lucia-artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
