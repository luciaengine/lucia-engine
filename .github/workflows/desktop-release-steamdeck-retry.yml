name: Lucia Steam Deck release retry
on:
  push:
    branches: [release-build/d3b45f34-steamdeck-release-deps]
permissions:
  contents: read
env:
  SOURCE_COMMIT: d3b45f3471421c11335afc66f785fe243b12b98c
jobs:
  steam-deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d3b45f3471421c11335afc66f785fe243b12b98c
          persist-credentials: false
      - name: Build and package the Steam Runtime 4 Player
        shell: bash
        env:
          VCPKG_MAX_CONCURRENCY: '2'
          GE_STEAMDECK_HOST_DIST_DIR: ${{ runner.temp }}/lucia-steam-deck
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p dependencies
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git dependencies/vcpkg
          git -C dependencies/vcpkg checkout --detach a4f7741c53c97354fc43222fea17955c657dd549
          python3 - <<'PYTHON'
          from pathlib import Path
          dockerfile = Path('Tools/Docker/Dockerfile.steamdeck-dev')
          text = dockerfile.read_text()
          packages = "RUN apt-get update && apt-get install -y --no-install-recommends autoconf autoconf-archive automake libtool && rm -rf /var/lib/apt/lists/*"
          dockerfile.write_text(text.replace('WORKDIR /src', packages + '\nWORKDIR /src'))
          PYTHON
          printf '\nset(VCPKG_BUILD_TYPE release)\n' >> cmake/triplets/x64-steamdeck.cmake
          if ! bash Tools/Scripts/build-steamdeck-docker.sh -j 4; then
            diagnostic_dir="$GE_STEAMDECK_HOST_DIST_DIR/vcpkg-failure-logs"
            if [ -d "$diagnostic_dir" ]; then
              find "$diagnostic_dir" -type f -name '*-out.log' -print0 |
                xargs -0 -r grep -nEi 'FAILED:|error:|fatal error|Killed|not found|No space' |
                grep -vC0 'CMakeScratch/' | cut -c1-900 | tail -80 || true
              find "$diagnostic_dir/harfbuzz" -name 'package-*-out.log' -exec tail -n 30 '{}' ';' || true
            fi
            exit 1
          fi
          tar -tzf "$GE_STEAMDECK_HOST_DIST_DIR/steamdeck-player.tar.gz" > "$RUNNER_TEMP/deck-members.txt"
          grep -E '/Player$' "$RUNNER_TEMP/deck-members.txt"
          sha256sum "$GE_STEAMDECK_HOST_DIST_DIR/steamdeck-player.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lucia-steam-deck-player-d3b45f34
          path: ${{ runner.temp }}/lucia-steam-deck/steamdeck-player.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
