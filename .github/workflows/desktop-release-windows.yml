name: Lucia Windows release build
on:
  push:
    branches: [release-build/1.0.0-windows]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8a45874fbd39affb85dc914be887507ab20423d
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: D:/lucia-vcpkg-binaries
          key: windows-vs2026-vcpkg-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/**') }}
      - name: Configure Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_MAX_CONCURRENCY: '4'
          VCPKG_BINARY_SOURCES: 'files,D:/lucia-vcpkg-binaries,readwrite'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne 'f8a45874fbd39affb85dc914be887507ab20423d') { throw 'Unexpected checkout' }
          if ((Get-Content VERSION -Raw).Trim() -ne '1.0.0') { throw 'Unexpected engine version' }
          New-Item -ItemType Directory -Force D:/lucia-vcpkg-binaries | Out-Null
          cmake --preset vs2026-x64-local -B D:/lucia-release -DBUILD_TESTING=OFF -DBUILD_EDITOR=ON -DBUILD_TOOLS=OFF
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: D:/lucia-vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build D:/lucia-release --config Release --target Editor --parallel 4
      - name: Package staged Editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = 'D:/lucia-release/bin/Release'
          $name = 'LuciaEngine-1.0.0-Windows-x86_64'
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory $stage | Out-Null
          New-Item -ItemType Directory "$stage/Apps" | Out-Null
          Copy-Item "$bin/Apps/Editor" "$stage/Apps/Editor" -Recurse
          if (Test-Path "$bin/Tools") { Copy-Item "$bin/Tools" "$stage/Tools" -Recurse }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md "$stage/"
          @'
          Lucia Engine 1.0.0
          Source commit: f8a45874fbd39affb85dc914be887507ab20423d
          Platform: Windows x86-64

          Extract the entire archive. Open Apps/Editor/Editor.exe to create
          or open a project.
          A Vulkan-capable GPU driver is required to render.
          '@ | Set-Content "$stage/README.txt"
          foreach ($app in @('Editor')) {
            $exe = "$stage/Apps/$app/$app.exe"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $header = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $header) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes, $header + 4) -ne 0x8664) { throw "Invalid x86-64 executable: $exe" }
            if (-not (Test-Path "$stage/Apps/$app/Assets/Shaders")) { throw "Shaders missing for $app" }
            Get-FileHash $exe
          }
          New-Item -ItemType Directory D:/lucia-artifacts | Out-Null
          tar.exe -a -cf "D:/lucia-artifacts/$name.zip" -C $env:RUNNER_TEMP $name
          $members = @(tar.exe -tf "D:/lucia-artifacts/$name.zip")
          foreach ($app in @('Editor')) {
            if ($members -notcontains "$name/Apps/$app/$app.exe") { throw "Archive missing $app" }
          }
          Get-FileHash "D:/lucia-artifacts/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lucia-windows-release
          path: D:/lucia-artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
